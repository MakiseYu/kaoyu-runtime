# Kaoyu's managed defaults for the pinned Codex 0.163.0 engine.
# A conversation supplies the user's third-party provider over local JSON-RPC.
# Before that, an unconfigured request fails locally instead of selecting OpenAI.
model_provider = "kaoyu"
model = "kaoyu-unconfigured"
check_for_update_on_startup = false
thread_unload_delay_secs = 0
cli_auth_credentials_store = "ephemeral"
web_search = "disabled"
include_apps_instructions = false

[model_providers.kaoyu]
name = "Kaoyu custom Responses"
base_url = "http://127.0.0.1:1/v1"
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 0
stream_max_retries = 0

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
log_user_prompt = false
log_agent_responses = false
log_guardian_assessments = false

[agents]
enabled = true

[tools.experimental_request_user_input]
